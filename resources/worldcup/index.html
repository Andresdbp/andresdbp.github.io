<style>
:root{
  --bg:#ededed; --card:#ffffff; --line:#e6e6e8; --line-soft:#eeeeef;
  --text:#161618; --muted:#6b7280;
  --accent:#507dbc; --accent-strong:#3f6aa6; --accent-bg:rgba(80,125,188,.12);
  --green:#2f7d5b; --green-bg:rgba(47,125,91,.13);
  --played:#8a8d94; --played-bg:#f1f2f4; --barbg:#e8eaee;
  --shadow:0 6px 18px rgba(23,45,84,.06);
}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1e1e1f; --line:#2d2d2f; --line-soft:#262628;
  --text:#ffffff; --muted:#8b8f98;
  --accent:#507dbc; --accent-strong:#6a97d6; --accent-bg:rgba(80,125,188,.18);
  --green:#5aa77f; --green-bg:rgba(90,167,127,.16);
  --played:#8b8f98; --played-bg:#242426; --barbg:#2c2c2e;
  --shadow:0 6px 18px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Poppins',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease}
.wrap{max-width:1320px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;font-weight:600;margin:0;white-space:nowrap}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:0 0 18px}
#reset{white-space:nowrap}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600}
.pill.ok{background:var(--accent-bg);color:var(--accent-strong)}
.pill.busy{background:var(--played-bg);color:var(--muted)}
#status{margin-left:auto}
.layout{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.layout>*{min-width:0}
@media (max-width:940px){.layout{grid-template-columns:1fr}}
aside{position:sticky;top:14px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow);transition:background .3s ease,border-color .3s ease}
.panel h2{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin:0 0 12px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
button{font:inherit;font-size:13px;background:var(--card);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:7px 13px;cursor:pointer;transition:border-color .2s ease,color .2s ease}
button:hover{border-color:var(--accent);color:var(--accent-strong)}
.odds .o{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13.5px}
.odds .fl{width:20px;text-align:center;font-size:15px;flex:none}
.odds .nm{width:96px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odds .tk{flex:1;height:16px;background:var(--barbg);border-radius:5px;overflow:hidden;position:relative}
.odds .tk>i{position:absolute;top:0;left:0;height:100%;background:var(--accent);border-radius:5px}
.odds .pc{width:52px;text-align:right;flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.bracket-wrap{overflow-x:auto;min-width:0;padding-bottom:8px}
.bracket{display:flex;gap:14px;min-width:726px;min-height:700px;align-items:stretch}
.col{display:flex;flex-direction:column;flex:1;min-width:134px}
.col h3{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;
  text-align:center;margin:0 0 10px}
.col-matches{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:var(--shadow)}
.m.open{border-color:var(--accent)}
.m.settled{border-color:var(--green);background:var(--green-bg)}
.m.played{background:var(--played-bg)}
.m.tbd{opacity:.9;border-style:dashed}
.finalgroup{display:flex;flex-direction:column;gap:12px}
.slot{position:relative;display:flex;align-items:center;gap:8px;padding:4px 9px;line-height:1.3;border-radius:7px;overflow:hidden}
.slot .bar{position:absolute;left:0;top:0;bottom:0;background:var(--barbg);z-index:0;border-radius:7px}
.m.open .slot .bar{background:var(--accent-bg)}
.slot>*{position:relative;z-index:1}
.slot .fl{font-size:13px;width:16px;text-align:center;flex:none}
.slot .nm{flex:none;width:32px;font-size:12px;font-weight:500;letter-spacing:.03em;white-space:nowrap;overflow:hidden}
.slot .xg{font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--muted);opacity:.8;flex:none;width:auto;text-align:left}
.slot .pc{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);flex:none;width:auto;text-align:left}
.m.open .slot{cursor:pointer}
.m.open .slot:hover{outline:1px solid var(--accent)}
.slot.win{font-weight:600}
.slot.win .nm{color:var(--green)}
.m.open .slot.win .nm{color:var(--accent-strong)}
.slot.lose{opacity:.5}
.slot.tbdrow .nm{color:var(--muted);font-style:italic;font-weight:400}
.thirdlbl{font-size:10px;color:var(--muted);text-align:center;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
details+details{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px}
summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--text);list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";font-size:9px;color:var(--accent-strong)}
details[open] summary::before{content:"▾"}
details .hint{margin-top:9px}
details code{background:var(--barbg);padding:1px 5px;border-radius:5px;font-size:11.5px}
.theme-fab{position:fixed;bottom:16px;right:16px;z-index:70;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);
  color:var(--muted);box-shadow:var(--shadow);cursor:pointer;transition:color .2s ease,transform .2s ease}
.theme-fab:hover{color:var(--accent-strong);transform:translateY(-2px)}
.theme-fab svg{width:20px;height:20px}
.theme-fab .ic-moon{display:none}.theme-fab .ic-sun{display:block}
:root[data-theme="dark"] .theme-fab .ic-sun{display:none}
:root[data-theme="dark"] .theme-fab .ic-moon{display:block}
/* phone: height isn't the constraint — pack each stage so it reads as a whole.
   placed last so it wins the cascade over the base .bracket/.col-matches rules */
@media (max-width:940px){
  aside{position:static}
  .bracket{min-height:auto;align-items:flex-start}
  .col-matches{justify-content:flex-start;gap:8px}
}
</style>

const wonBy = {};
for(const m of matches){ if(m.played && m.winner) wonBy[m.winner]=m.num; }
const feeders = m => [m.t1,m.t2].map(s => /^[WL]\d+$/.test(s) ? +s.slice(1) : wonBy[s]);
// depth-first from the final → each round ordered top-to-bottom with feeders adjacent,
// so `justify-content:space-around` centres every match between its two feeders.
const ORDER = {}; D.rounds.forEach(r=>ORDER[r]=[]);
(function dfs(num){
  const m=numToMatch[num]; if(!m) return;
  ORDER[m.round].push(num);
  if(D.rounds.indexOf(m.round)>0){ const f=feeders(m); if(f[0]) dfs(f[0]); if(f[1]) dfs(f[1]); }
})(FINAL_NUM);
// --- live Elo re-rating from played knockout ties (World-Football Elo, K=60) ---
// The snapshot ratings already fold in ties through match #RATED_THROUGH; every later
// result is applied here so "current strength" tracks the tournament as it unfolds.
const RATED_THROUGH = 82;
const UNC = 1.0;                            // strength-uncertainty scale (× fitted resid sd)
const baseRating = {};
Object.keys(D.teams).forEach(n => baseRating[n] = D.teams[n].rating);
(function reRate(){
  const goalMult = d => { d=Math.abs(d); return d<=1?1:d===2?1.5:(11+d)/8; };
  const isW = s => typeof s==='string' && /^[WL]\d+$/.test(s);
  const res = (s,win,los) => isW(s) ? (s[0]==='W'?win[+s.slice(1)]:los[+s.slice(1)]) : s;
  const win={}, los={};                          // resolve W##/L## slot references in order
  const done = matches.filter(m => m.played && m.winner).sort((a,b)=>a.num-b.num);
  for(const m of done){
    const a=res(m.t1,win,los), b=res(m.t2,win,los);
    win[m.num]=m.winner; los[m.num]=(m.winner===a?b:a);
    if(m.num<=RATED_THROUGH) continue;           // already folded into the snapshot ratings
    if(a==null || b==null || baseRating[a]==null || baseRating[b]==null) continue;
    const ra=baseRating[a], rb=baseRating[b];
    const ea=1/(1+Math.pow(10,(rb-ra)/400));      // Elo win expectancy for a
    let sa, gd;
    if(m.s1===m.s2){ sa=0.5; gd=0; }              // decided on penalties → a draw for Elo
    else { sa=(m.winner===a)?1:0; gd=Math.abs(m.s1-m.s2); }
    const delta=60*goalMult(gd)*(sa-ea);
    baseRating[a]=ra+delta; baseRating[b]=rb-delta;
  }
})();
let ratingDelta = {};                       // per-tournament strength perturbation
const rating = n => (baseRating[n]!=null ? baseRating[n] : 1500) + (ratingDelta[n] || 0);
const residSd = n => (D.teams[n] && D.teams[n].resid_sd) ? D.teams[n].resid_sd : 60;
const flag = n => (D.teams[n] ? (D.teams[n].flag||'') : '');
const codeOf = n => (D.teams[n] && D.teams[n].code) ? D.teams[n].code
                    : (n ? String(n).replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() : '—');
const userSettles = {};           // num -> chosen winner (hypotheticals only)
const NSIMS = 100000;

// teams not yet eliminated (losers of any decided tie are out) — only these are
// resampled and simulated forward.
function aliveTeams(concrete, fixed){
  const dead=new Set();
  for(const num in fixed){ const c=concrete[num]; if(!c) continue;
    const w=fixed[num], l=(w===c.t1)?c.t2:c.t1; if(l) dead.add(l); }
  return Object.keys(D.teams).filter(t=>!dead.has(t));
}

// ---- fast simulation (mirrors the Python fast bracket path) ----
function pois(l){ if(l<=0) return 0; const L=Math.exp(-l); let k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; }
function lambdas(rh,ra){ const d=(rh-ra)/100; return [Math.exp(mu+beta*d), Math.exp(mu-beta*d)]; }
function shootout(ra,rb){
  const pa=Math.min(.9,Math.max(.55,.75+.04*Math.tanh((ra-rb)/200)));
  const pb=Math.min(.9,Math.max(.55,.75+.04*Math.tanh((rb-ra)/200)));
  let a=0,b=0;
  for(let k=0;k<5;k++){ a+=Math.random()<pa?1:0; b+=Math.random()<pb?1:0; const rem=5-(k+1); if(a>b+rem||b>a+rem)break; }
  while(a===b){ a+=Math.random()<pa?1:0; b+=Math.random()<pb?1:0; }
  return a>b;
}
function simMatch(t1,t2){
  const r1=rating(t1), r2=rating(t2);
  const [l1,l2]=lambdas(r1,r2);
  let g1=pois(l1), g2=pois(l2);
  if(g1!==g2) return g1>g2?t1:t2;
  const e1=pois(l1*30/90), e2=pois(l2*30/90);
  if(e1!==e2) return e1>e2?t1:t2;
  return shootout(r1,r2)?t1:t2;
}
const isPlace = s => typeof s==='string' && /^[WL]\d+$/.test(s);
function resolve(name, winners, losers){
  if(isPlace(name)){ const n=+name.slice(1); return name[0]==='W'?winners[n]:losers[n]; }
  return name;
}

// ---- deterministic resolution from played + valid user picks ----
function computeFixed(){
  const winners={}, losers={}, concrete={}, determined={}, fixed={};
  for(const m of matches){
    const t1=resolve(m.t1,winners,losers)||null, t2=resolve(m.t2,winners,losers)||null;
    concrete[m.num]={t1,t2}; const det=!!(t1&&t2); determined[m.num]=det;
    if(m.round==='Match for third place') continue;
    let w=null;
    if(m.played) w=m.winner;
    else if(det && userSettles[m.num] && (userSettles[m.num]===t1||userSettles[m.num]===t2)) w=userSettles[m.num];
    else if(userSettles[m.num] && !det){ delete userSettles[m.num]; }
    else if(userSettles[m.num] && det && userSettles[m.num]!==t1 && userSettles[m.num]!==t2){ delete userSettles[m.num]; }
    if(w){ fixed[m.num]=w; winners[m.num]=w; losers[m.num]=(w===t1?t2:t1); }
  }
  return {concrete, determined, fixed};
}

// ---- Monte-Carlo over the remaining bracket ----
// Each simulated tournament first resamples every surviving team's strength from its
// fitted residual (parameter uncertainty), then plays out every undecided tie. Averaging
// over draws propagates that uncertainty into the title odds and advance probabilities.
function runMC(n, fixed, alive){
  const champ={}, slot={}, wins={};
  for(const m of KO){ slot[m.num]=[{},{}]; wins[m.num]={}; }
  if(third){ slot[third.num]=[{},{}]; wins[third.num]={}; }   // 3rd-place play-off
  for(let s=0;s<n;s++){
    ratingDelta={};
    for(let i=0;i<alive.length;i++) ratingDelta[alive[i]]=gauss(0, UNC*residSd(alive[i]));
    const winners={}, losers={};
    for(const m of KO){
      const t1=resolve(m.t1,winners,losers), t2=resolve(m.t2,winners,losers);
      slot[m.num][0][t1]=(slot[m.num][0][t1]||0)+1;
      slot[m.num][1][t2]=(slot[m.num][1][t2]||0)+1;
      const w = (m.num in fixed)? fixed[m.num] : simMatch(t1,t2);
      wins[m.num][w]=(wins[m.num][w]||0)+1;
      winners[m.num]=w; losers[m.num]=(w===t1?t2:t1);
    }
    const c=winners[FINAL_NUM]; champ[c]=(champ[c]||0)+1;
    if(third){                                    // losers of the two semis meet for 3rd place
      const a=resolve(third.t1,winners,losers), b=resolve(third.t2,winners,losers);
      if(a && b){
        slot[third.num][0][a]=(slot[third.num][0][a]||0)+1;
        slot[third.num][1][b]=(slot[third.num][1][b]||0)+1;
        const w3 = third.played ? third.winner : simMatch(a,b);
        wins[third.num][w3]=(wins[third.num][w3]||0)+1;
      }
    }
  }
  ratingDelta={};
  return {champ, slot, wins, n};
}
const argmax = o => { let bk=null,bv=-1; for(const k in o) if(o[k]>bv){bv=o[k];bk=k;} return [bk,bv]; };

// ---- rendering ----
function render(){
  const {concrete, determined, fixed} = computeFixed();
  const alive = aliveTeams(concrete, fixed);
  const mc = runMC(NSIMS, fixed, alive);

  // title odds
  const champ = Object.entries(mc.champ).map(([t,c])=>[t,c/mc.n]).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const mx = champ.length?champ[0][1]:1;
  document.getElementById('odds').innerHTML = champ.map(([t,p])=>{
    const bar = `<i style="width:${(p/mx*100).toFixed(1)}%"></i>`, pc = `${(p*100).toFixed(1)}%`;
    return `<div class="o"><span class="fl">${flag(t)}</span><span class="nm">${t}</span>
      <span class="tk">${bar}</span><span class="pc">${pc}</span></div>`;
  }).join('');

  // bracket columns — tree order so each match sits between its two feeders
  const cols = D.rounds.map(rd=>{
    let cards = ORDER[rd].map(num=>renderMatch(numToMatch[num], concrete[num], determined[num], fixed, mc)).join('');
    if(rd==='Final' && third)                        // 3rd-place match sits under the final
      cards = `<div class="finalgroup">${cards}${renderThird(third, mc)}</div>`;
    return `<div class="col"><h3>${rd}</h3><div class="col-matches">${cards}</div></div>`;
  }).join('');
  document.getElementById('bracket').innerHTML = cols;
}

function slotRow(num, team, right, barPct, {win=false, lose=false, click=false, tbd=false, xg=null}={}){
  const cls = ['slot', win?'win':'', lose?'lose':'', tbd?'tbdrow':''].join(' ');
  const label = team ? codeOf(team) : '—';
  const data = click ? `data-num="${num}" data-team="${team}"` : '';
  const ttl = team ? ` title="${team}"` : '';
  const xgHtml = (xg != null) ? `<span class="xg" title="expected goals">${xg.toFixed(1)}</span>` : '';
  return `<div class="${cls}" ${data}${ttl}>
      <span class="bar" style="width:${barPct||0}%"></span>
      <span class="fl">${team?flag(team):''}</span>
      <span class="nm">${label}</span>${xgHtml}<span class="pc">${right||''}</span></div>`;
}

function renderMatch(m, con, det, fixed, mc){
  const {t1,t2}=con;
  // undetermined -> show modal occupants
  if(!det){
    const [a,ac]=argmax(mc.slot[m.num][0]); const [b,bc]=argmax(mc.slot[m.num][1]);
    return `<div class="m tbd" title="to be decided">
      ${slotRow(m.num,a,`${Math.round(ac/mc.n*100)}%`,0,{tbd:true})}
      ${slotRow(m.num,b,`${Math.round(bc/mc.n*100)}%`,0,{tbd:true})}</div>`;
  }
  const w = fixed[m.num];
  const p1 = (mc.wins[m.num][t1]||0)/mc.n, p2=(mc.wins[m.num][t2]||0)/mc.n;
  const [l1,l2]=lambdas(rating(t1), rating(t2));
  if(m.played){
    return `<div class="m played" title="${t1} ${m.s1}–${m.s2} ${t2} · expected goals ${l1.toFixed(1)}–${l2.toFixed(1)}">
      ${slotRow(m.num,t1,`${m.s1}`,0,{win:w===t1,lose:w!==t1,xg:l1})}
      ${slotRow(m.num,t2,`${m.s2}`,0,{win:w===t2,lose:w!==t2,xg:l2})}</div>`;
  }
  const settled = userSettles[m.num];
  if(settled){
    return `<div class="m settled" title="your pick — click to undo · expected goals ${l1.toFixed(1)}–${l2.toFixed(1)}">
      ${slotRow(m.num,t1,settled===t1?'✓':'',0,{win:settled===t1,lose:settled!==t1,click:true,xg:l1})}
      ${slotRow(m.num,t2,settled===t2?'✓':'',0,{win:settled===t2,lose:settled!==t2,click:true,xg:l2})}</div>`;
  }
  // determined & open -> settleable, show expected goals + advance probs
  return `<div class="m open" title="expected goals ${l1.toFixed(1)}–${l2.toFixed(1)} · click a team to settle">
      ${slotRow(m.num,t1,`${Math.round(p1*100)}%`,p1*100,{win:p1>=p2,click:true,xg:l1})}
      ${slotRow(m.num,t2,`${Math.round(p2*100)}%`,p2*100,{win:p2>p1,click:true,xg:l2})}</div>`;
}

function renderThird(m, mc){
  const S=mc.slot[m.num]||[{},{}], W=mc.wins[m.num]||{};
  const [a]=argmax(S[0]||{}), [b]=argmax(S[1]||{});
  const pa=(W[a]||0)/mc.n, pb=(W[b]||0)/mc.n;
  return `<div class="m tbd" title="3rd-place play-off · % = chance of finishing 3rd">
    <div class="thirdlbl">3rd place</div>
    ${slotRow(m.num, a, a?`${Math.round(pa*100)}%`:'', 0, {tbd:true})}
    ${slotRow(m.num, b, b?`${Math.round(pb*100)}%`:'', 0, {tbd:true})}</div>`;
}

// ---- interaction ----
function withStatus(fn){
  const s=document.getElementById('status'); s.textContent='simulating…'; s.className='pill busy';
  setTimeout(()=>{ fn(); s.textContent='updated'; s.className='pill ok'; }, 10);
}
document.getElementById('bracket').addEventListener('click', e=>{
  const undo=e.target.closest('[data-undo]');
  if(undo){ delete userSettles[+undo.dataset.undo]; withStatus(render); return; }
  const slot=e.target.closest('.slot[data-num]');
  if(!slot) return;
  const num=+slot.dataset.num, team=slot.dataset.team;
  if(userSettles[num]===team) delete userSettles[num];   // toggle off
  else userSettles[num]=team;
  withStatus(render);
});
document.getElementById('reset').addEventListener('click', ()=>{
  for(const k in userSettles) delete userSettles[k]; withStatus(render);
});
document.getElementById('theme').addEventListener('click', ()=>{
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
});
document.getElementById('about').innerHTML =
  `Self-computed World-Football Elo feeds a bivariate-Poisson goal model `+
  `(<code>&beta;=${beta.toFixed(3)}</code>); ties resolve through extra time and penalties. Ratings are `+
  `re-fit after every played knockout result (K=60), and each of the <b>100,000</b> Monte-Carlo tournaments `+
  `per update resamples each surviving team's strength from its fitted residual — so the odds carry model `+
  `uncertainty, not false precision. Snapshot ${D.snapshot}.`;
render();
</script>
</body>
</html>
